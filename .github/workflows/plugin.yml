name: Limiter plugin

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux: DSP tests, then cross-compile the Windows plugin with MinGW-w64 (the toolchain DPF supports on Windows).
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev

      - name: DSP tests
        run: |
          cmake -S plugin -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target test_limiter test_limiter_noclamp --parallel
          ctest --test-dir build-linux --output-on-failure
          echo "::notice title=DSP tests::all limiter checks passed (44.1/48/96 kHz, with and without the safety clamp)"

      - name: Build for Windows
        run: |
          cmake -S plugin -B build-win -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
                -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          cmake --build build-win --parallel 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0 || { grep -E ': (fatal )?error' build.log | head -15 | sed 's/^/::error title=Build::/'; exit 1; }
          x86_64-w64-mingw32-strip --strip-unneeded build-win/bin/VolumeGuardLimiter.vst3/Contents/x86_64-win/VolumeGuardLimiter.vst3 build-win/bin/VolumeGuardLimiter.clap
          # the plugin must only need system DLLs
          x86_64-w64-mingw32-objdump -p build-win/bin/VolumeGuardLimiter.vst3/Contents/x86_64-win/VolumeGuardLimiter.vst3 | grep "DLL Name"

      - name: Package
        id: ver
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ver=$(tr -d '[:space:]' < plugin/VERSION)
          mkdir -p out/VST3 out/CLAP
          cp -r build-win/bin/VolumeGuardLimiter.vst3 out/VST3/
          cp build-win/bin/VolumeGuardLimiter.clap out/CLAP/
          cp plugin/README.md out/README.md
          cp LICENSE out/LICENSE
          (cd out && zip -qr ../VolumeGuardLimiter-Windows.zip .)
          release=false
          if [ "${{ github.event_name }}" = "push" ] && [[ "$COMMIT_MESSAGE" == *"[limiter-release]"* ]]; then release=true; fi
          echo "tag=limiter-v$ver" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeGuardLimiter-Windows
          path: VolumeGuardLimiter-Windows.zip

  # Windows: load the plugin the way a DAW does (pluginval, incl. Steinberg's VST3 validator), then publish.
  validate:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VolumeGuardLimiter-Windows

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Expand-Archive VolumeGuardLimiter-Windows.zip -DestinationPath pkg
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $vst3 = (Resolve-Path pkg/VST3/VolumeGuardLimiter.vst3).Path
          Write-Host "Validating $vst3"
          $p = Start-Process pluginval/pluginval.exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--strictness-level', '10', '--validate-in-process', '--output-dir', 'pluginval-logs', '--validate', "`"$vst3`"")
          $log = (Get-ChildItem pluginval-logs -Recurse -File | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          Write-Host $log
          if ($p.ExitCode -ne 0) { throw "pluginval failed with exit code $($p.ExitCode)" }
          # make sure the tests really ran, not just that pluginval exited
          if ($log -notmatch 'SUCCESS' -or $log -notmatch 'vst3 validator' -or $log -notmatch 'Editor') { throw "pluginval log is incomplete" }
          $tests = ([regex]::Matches($log, 'Completed tests in')).Count
          Write-Host "::notice title=pluginval::SUCCESS at strictness 10, $tests test groups passed (incl. editor and Steinberg vst3 validator)"

      # Commit message with [limiter-release] publishes plugin/VERSION as a release.
      # It is not marked "latest", so the app download button keeps pointing at VolumeGuard itself.
      - name: Publish release
        if: needs.build.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VolumeGuard Limiter ${{ needs.build.outputs.tag }}
          body_path: plugin/release-notes.md
          files: VolumeGuardLimiter-Windows.zip
          make_latest: false
