name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework C# compiler
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:anycpu /optimize+
          /win32icon:assets\app.ico /out:VolumeGuard.exe
          /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll src\*.cs

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force VolumeGuard | Out-Null
          Copy-Item VolumeGuard.exe, LICENSE VolumeGuard/
          Compress-Archive -Path VolumeGuard -DestinationPath VolumeGuard.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeGuard
          path: VolumeGuard.zip

      # A release is published for a pushed v* tag, or for a push to main whose
      # commit message contains [release] (the version is taken from the VERSION file).
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}" }
          else { $v = "v" + (Get-Content VERSION -Raw).Trim() }
          "tag=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VolumeGuard ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: VolumeGuard.zip
