name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # The sound-processing engine (vgaudio.dll): offline tests, then a MinGW-w64 cross-build.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64

      - name: Engine tests (clock drift, sample rates, gaps, formats, processing chain)
        run: |
          cd native
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Isrc tests/test_bridge.cpp -o test_bridge
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -Isrc -I../plugin/src tests/test_processor.cpp -o test_processor
          ./test_bridge | tee bridge.txt
          ./test_processor
          echo "::notice title=Engine tests::$(grep -c 'underruns 0' bridge.txt) drift scenarios without gaps; all bridge and processor checks passed"

      - name: Build vgaudio.dll
        run: |
          native/build.sh 2>&1 | tee native.log
          test ${PIPESTATUS[0]} -eq 0 || { grep -E ': (fatal )?error' native.log | head -15 | sed 's/^/::error title=vgaudio::/'; exit 1; }
          if grep -q 'warning:' native.log; then grep 'warning:' native.log | head -10 | sed 's/^/::warning title=vgaudio::/'; fi
          # only system DLLs
          x86_64-w64-mingw32-objdump -p native/build/vgaudio.dll | grep "DLL Name"

      - uses: actions/upload-artifact@v4
        with:
          name: vgaudio
          path: |
            native/build/vgaudio.dll
            native/build/vgaudio-smoke.exe

  build:
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vgaudio
          path: native-bin

      - name: Build with the .NET Framework C# compiler
        shell: cmd
        run: >
          mkdir out &&
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:anycpu /optimize+
          /win32icon:assets\app.ico /out:out\VolumeGuard.exe
          /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll src\*.cs &&
          copy LICENSE out\LICENSE &&
          copy native-bin\vgaudio.dll out\vgaudio.dll

      - name: Smoke test vgaudio.dll
        shell: pwsh
        run: |
          Copy-Item native-bin/vgaudio-smoke.exe out/
          Push-Location out
          ./vgaudio-smoke.exe
          $code = $LASTEXITCODE
          Remove-Item vgaudio-smoke.exe
          Pop-Location
          if ($code -ne 0) { throw "vgaudio smoke test failed" }
          # the same calls through .NET P/Invoke, as VolumeGuard.exe makes them (64-bit PowerShell)
          $dll = (Resolve-Path out/vgaudio.dll).Path
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices; using System.Text;
          public static class Vg {
            [DllImport(@"$dll", CallingConvention = CallingConvention.Cdecl)] public static extern int vg_version();
            [DllImport(@"$dll", CallingConvention = CallingConvention.Cdecl, CharSet = CharSet.Unicode)] public static extern int vg_list_devices(StringBuilder b, int c);
            [DllImport(@"$dll", CallingConvention = CallingConvention.Cdecl, CharSet = CharSet.Unicode)] public static extern int vg_start(string a, string b);
          }
          "@
          if ([Vg]::vg_version() -ne 1) { throw "vg_version via P/Invoke" }
          if ([Vg]::vg_start("same", "same") -ne -2) { throw "vg_start via P/Invoke" }
          "::notice title=vgaudio::DLL loads in .NET (64-bit), API version $([Vg]::vg_version()), $([Vg]::vg_list_devices($null, 0)) chars of device list"

      # Product name and version are part of the signing policy: make sure the exe carries the right ones.
      - name: Check product name and version
        id: ver
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $want = (Get-Content VERSION -Raw).Trim()
          $info = (Get-Item out/VolumeGuard.exe).VersionInfo
          if ($info.ProductName -ne 'VolumeGuard') { throw "ProductName is '$($info.ProductName)', expected 'VolumeGuard'" }
          if ($info.ProductVersion -ne $want) { throw "ProductVersion is '$($info.ProductVersion)', VERSION file says '$want' (update src/AssemblyInfo.cs)" }
          if (-not $info.FileVersion.StartsWith($want)) { throw "FileVersion is '$($info.FileVersion)', VERSION file says '$want'" }
          if ("${{ github.ref }}" -like "refs/tags/v*") { $tag = "${{ github.ref_name }}" } else { $tag = "v$want" }
          $release = ("${{ github.ref }}" -like "refs/tags/v*") -or
                     ("${{ github.event_name }}" -eq "push" -and "$env:COMMIT_MESSAGE".Contains('[release]'))
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "VolumeGuard $want, release: $release"

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VolumeGuard-unsigned
          path: out/

      # Runs only for releases, and only once SignPath is set up (see .signpath/README.md).
      # SignPath waits for a manual approval of every release before it signs.
      - name: Sign with SignPath
        if: steps.ver.outputs.release == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      # VB-CABLE by VB-Audio (donationware) ships in the archive, unchanged, as its licence allows:
      # https://vb-audio.com/Services/licensing.htm. The download is pinned by SHA-256 and the
      # installers must carry a valid Authenticode signature.
      - name: Bundle VB-CABLE
        shell: pwsh
        run: |
          $url = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip'
          $want = if (Test-Path .github/vbcable.sha256) { (Get-Content .github/vbcable.sha256 -Raw).Trim().ToUpper() } else { '' }
          Invoke-WebRequest $url -OutFile vbcable.zip -UseBasicParsing
          $hash = (Get-FileHash vbcable.zip -Algorithm SHA256).Hash
          if ($want -eq '') {
            if ('${{ steps.ver.outputs.release }}' -eq 'true') { throw "pin the VB-CABLE hash in .github/vbcable.sha256 before releasing ($hash)" }
            "::warning title=VB-CABLE::not pinned yet, SHA-256 $hash"
          } elseif ($hash -ne $want) { throw "VB-CABLE download changed: $hash, pinned $want" }
          Expand-Archive vbcable.zip vbcable -Force
          $files = (Get-ChildItem vbcable -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path vbcable).Path.Length + 1) }) -join ', '
          "::notice title=VB-CABLE files::$files"
          foreach ($exe in Get-ChildItem vbcable -Recurse -Filter *.exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "::notice title=VB-CABLE signature::$($exe.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($exe.Name) is not validly signed" }
          }
          if (-not (Get-ChildItem vbcable -Recurse -Filter VBCABLE_Setup_x64.exe)) { throw "VBCABLE_Setup_x64.exe not in the pack" }

      - name: Package
        shell: pwsh
        run: |
          $src = if (Test-Path signed/VolumeGuard.exe) { 'signed' } else { 'out' }
          Write-Host "Packaging from: $src"
          New-Item -ItemType Directory -Force VolumeGuard | Out-Null
          Copy-Item "$src/VolumeGuard.exe", "$src/LICENSE" VolumeGuard/
          $dll = if (Test-Path signed/vgaudio.dll) { 'signed/vgaudio.dll' } else { 'out/vgaudio.dll' }
          Copy-Item $dll VolumeGuard/
          # the setups must sit directly in VBCABLE/ (that is where the app looks)
          $root = (Get-ChildItem vbcable -Recurse -Filter VBCABLE_Setup_x64.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force VolumeGuard/VBCABLE | Out-Null
          Copy-Item "$root/*" VolumeGuard/VBCABLE/ -Recurse
          Copy-Item assets/ABOUT-VBCABLE.txt VolumeGuard/VBCABLE/
          Compress-Archive -Path VolumeGuard -DestinationPath VolumeGuard.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VolumeGuard
          path: VolumeGuard.zip

      # A release is published for a pushed v* tag, or for a push to main whose
      # commit message contains [release] (the version is taken from the VERSION file).
      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VolumeGuard ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: VolumeGuard.zip
